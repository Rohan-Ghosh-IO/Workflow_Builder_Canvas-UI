<svg
    xmlns="http://www.w3.org/2000/svg"
    width="256"
    height="256"
    viewBox="0 0 256 256"
    fill="none">

    <!-- Background -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6D5EF8"/>
            <stop offset="100%" stop-color="#4F46E5"/>
        </linearGradient>
    </defs>

    <rect
        x="8"
        y="8"
        width="240"
        height="240"
        rx="56"
        fill="url(#bg)" />

    <!-- Connections -->
    <path
        d="M82 82
           L128 82
           L128 128
           L174 128"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <path
        d="M82 174
           L128 174
           L128 128"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Nodes -->
    <circle cx="82" cy="82" r="16" fill="white"/>
    <circle cx="82" cy="174" r="16" fill="white"/>
    <circle cx="174" cy="128" r="16" fill="white"/>
    <circle cx="128" cy="128" r="18" fill="#E9E7FF"/>

</svg>